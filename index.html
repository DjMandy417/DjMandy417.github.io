<!DOCTYPE html>
<html lang="en">
<head>
<title>The Body of Christ Club</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@300;400;500;600;700&family=Macondo+Swash+Caps&family=Metamorphous&family=Modern+Antiqua&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&display=swap" rel="stylesheet">

<style>
html {
  scroll-behavior: smooth;
}

header {
    font-family: "Modern Antiqua", serif;
    font-size: 28px;
    background-size: cover;
    background-position: center;
    text-align: center;
    padding: 50px;
    color: #ffffff;
    text-shadow: 
        0 0 20px rgba(0,0,0,0.9),
        0 0 40px rgba(0,0,0,1),
        0 0 60px rgba(0,0,0,1),
        2px 2px 10px rgba(0,0,0,0.8);
    background-image: 
        linear-gradient(rgba(43, 54, 50, 0.5), rgba(43, 54, 50, 0.5)), 
        url('flowers2.jpg');
}

header h1 {
    font-size: 60px;
    font-family: "Modern Antiqua", serif;
    letter-spacing: 2px;
    margin-bottom: 12px;
    color: #ffffff;
    text-shadow:
        2px 2px 4px rgba(0,0,0,0.9),
        4px 4px 8px rgba(0,0,0,0.9),
        6px 6px 12px rgba(0,0,0,0.9),
        0 0 5px rgba(240, 230, 150, 0.3);
}

header p {
    font-family: "Modern Antiqua", serif;
    font-size: 32px;
    color: #ffffff;
    font-weight: bold;
    text-shadow:
        2px 2px 4px rgba(0,0,0,0.9),
        4px 4px 8px rgba(0,0,0,0.9),
        6px 6px 12px rgba(0,0,0,0.9),
        0 0 4px rgba(240, 230, 150, 0.25);
    margin: 0;
}

.navbar {
  display: flex;
  justify-content: center;
  background-color: #2a527d;
}

.navbar a {
  font-family: "Modern Antiqua", monospace;
  font-size: 23px;
  color: white;
  padding: 16px 24px;
  text-decoration: none;
  text-align: center;
  transition: all 0.5s ease;
  text-shadow: 3px 5px 5px rgba(0,0,0,0.7);
}

.navbar a:hover {
  background-color: #244569;
  color: #d0dbf6;
}

.story {
    position: relative;
    text-align: center;
    color: white;
    height: 550px;
    overflow: hidden;
    margin: 0;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: 
        linear-gradient(rgba(43, 54, 50, 0.3), rgba(43, 54, 50, 0.3)), 
        url('church2.png');
}

.story p {
    margin: 0;
    font-size: 21px;
    font-weight: bold;
    line-height: 1.4;  
    text-shadow: 4px 4px 8px rgba(0,0,0,1),
                 0 0 20px rgba(0,0,0,1),
                 0 0 25px rgba(0,0,0,1);
    color: white;
    width: 100%;
    max-width: 900px;
    text-align: center;
    font-family: "Modern Antiqua", monospace;
    padding: 30px;  
    z-index: 1;
    position: relative;
}

.highlight {
    font-weight: bold;
    font-size: 28px;
    color: #f0e699;  
    text-shadow: 4px 4px 10px rgba(0,0,0,1);
    display: block;
    margin: 15px 0;
    font-style: italic;
}

body {
    margin: 0;
    padding: 0;
}

.row {
    display: flex;
    width: 100%;
    margin: 0;
}

.column {
    flex: 1;
    padding: 40px 20px;
    min-height: 350px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: "Modern Antiqua", monospace;
    font-size: 23px;
    line-height: 1.6;
    color: #F7F7F7;
    font-weight: bold;
    text-shadow: 3px 5px 5px rgba(0,0,0,0.5);
}

.form-row{
 display: flex;
 justify-content: center;
 flex-wrap: wrap;
 gap: 20px;
 margin: 0 auto;
 padding: 40px 20px;
}
    
.form-box{
 flex: 1;
 min-width: 250px;
}

.container {
  max-width: 500px;
  margin: 0 auto; 
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}

input[type=text], select, textarea {
  width: 100%; 
  padding: 12px;  
  border: 1px solid #ccc; 
  border-radius: 4px;
  box-sizing: border-box; 
  margin-top: 6px; 
  margin-bottom: 16px; 
  resize: vertical; 
}

input[type=submit] {
  background-color: #6C8555;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #556943;
}

h2 {
  text-align: center;
  font-family: "Modern Antiqua", serif; 
  font-size: 35px; 
  font-weight: bolder;
  color: #f0e699;
  text-shadow: 4px 4px 10px rgba(0,0,0,4),
  4px 4px 10px rgba(0,0,0,4);
}

/* --- Mobile Version --- */
@media (max-width: 768px) {
  header h1 { font-size: 38px; }
  header p { font-size: 22px; }

  .navbar {
    flex-direction: column;
  }

  .navbar a {
    display: block;
    width: 100%;
    font-size: 20px;
    padding: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }

  .row {
    flex-direction: column;
  }

  .column {
    font-size: 20px;
    padding: 25px;
  }

  .story {
    height: auto;
    padding: 40px 10px;
  }

  .story p {
    font-size: 19px;
    padding: 20px;
  }

  footer div {
    flex-direction: column;
    gap: 8px;
  }

  footer {
    font-size: 14px;
    text-align: center;
    padding: 10px;
    position: relative; /* scrolls with page on mobile */
  }
}

</style>
</head>
