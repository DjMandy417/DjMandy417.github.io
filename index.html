<!DOCTYPE html>

<head> 
	
	<title> Email Alert </title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Comic+Relief:wght@400;700&family=Orbitron:wght@400..900&family=Press+Start+2P&family=Russo+One&display=swap" rel="stylesheet">

	<style>

		@keyframes bounce {
			0%, 100% {
				transform: translateY(0);
			}
			50% {
				transform: translateY(-20px);
			}
		}

		@keyframes pulse {
			0% {
				transform: scale(1);
			}
			50% {
				transform: scale(1.1);
			}
			100% {
				transform: scale(1);
			}
		}

		body {
			background-color: #ff9fc2;
		}

		h1 {
			color: #ffffff;
			font-size: 80px;
			font-family: "Press Start 2P", monospace;
			text-align: center;
			margin-top: 85px;
			text-shadow: 3px 3px 5px #cb0350;
			animation: bounce 1s 3;
		}
		
		.spacer {
			flex: 1;
		}

		button {
			display: block;
			width: 255px;
			background-color: white;
			color: #e63f7b;
			border: 2px solid white;
			font-size: 18px;
			border-radius: 3px;
			font-family: 'Press Start 2P', sans-serif;
			text-align: center;
			cursor: pointer;
			padding: 2px;
			animation: pulse 1.25s infinite;
			animation-delay: 3s;
		}

		.button-spacing {
			display: flex;
			justify-content: center;
			gap: 100px;
			margin-top: 100px;
		}

		.Letter {
			display: block;
			margin: 20px auto;
			width: 300px;
			max-height: 380px;
			object-fit: contain;
		}

		.press-start-2p-regular {
			font-family: "Press Start 2P", system-ui;
			font-weight: 400;
			font-style: normal;
		}

		.comic-relief-regular {
			font-family: "Comic Relief", system-ui;
			font-weight: 400;
			font-style: normal;
		}

		/* brah IK this part is chatgpt, i got lazy, i did ALOT by myself and the design is ORIGINAL (besides original inspiration from an online source (not AI like a tiktok video)--- Popup Styles --- */
		.popup {
			display: none;
			position: fixed;
			top: 0; 
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0,0,0,0.7);
			justify-content: center;
			align-items: center;
			z-index: 999;
		}

		.popup-image {
			max-width: 100%;
			max-height: 95%;
			border: 5px solid white;
			border-radius: 10px;
		}

		.close {
			position: absolute;
			top: 30px;
			right: 50px;
			font-size: 40px;
			color: white;
			cursor: pointer;
		}

	</style>

</head>

<body> 
	
	<h1> You Got Mail! </h1>

	<img src="https://i.imgur.com/TXcGYsE.png" alt="Letter Icon" class="Letter"> 

	<div class="button-spacing">
		<button id="openletter" class="first-button"> Open Letter </button> 
		<button id="sendspam" class="second-button"> Send to Spam </button>
	</div>

	<!-- This is CHATGPT now, it's 6:00 AM in the morning: Popup for Open Letter -->
	<div id="popupOpen" class="popup">
		<span class="close" onclick="closePopup('popupOpen')">&times;</span>
		<img src="https://i.imgur.com/wl8gQ62.png" class="popup-image" alt="Opened Letter">
	</div>

	<!-- Popup for Spam -->
	<div id="popupSpam" class="popup">
		<span class="close" onclick="closePopup('popupSpam')">&times;</span>
		<img src="https://i.imgur.com/LJbE0LU.png" class="popup-image" alt="Spam Letter">
	</div>

	<div class="spacer"></div>

	<script>
		function openPopup(popupId) {
			document.getElementById(popupId).style.display = "flex";
		}

		function closePopup(popupId) {
			document.getElementById(popupId).style.display = "none";
		}

		document.getElementById("openletter").onclick = function() {
			openPopup('popupOpen');
		};

		document.getElementById("sendspam").onclick = function() {
			openPopup('popupSpam');
		};
	</script>

</body>

</html>
